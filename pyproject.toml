[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-agent"
version = "0.3.0"
description = "AI research agent with a tool-calling loop: plans, searches the web, reads pages and writes cited reports"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40",
    "requests>=2.31",
    "ddgs>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.17.0", "mypy>=1.10", "types-requests", "pre-commit>=3"]

[project.scripts]
research-agent = "research_agent.cli:main"
research-agent-ui = "research_agent.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
research_agent = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
disallow_untyped_defs = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.coverage.run]
source = ["research_agent"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
